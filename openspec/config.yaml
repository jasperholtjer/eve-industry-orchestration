schema: row

context: |
  # eve-industry-orchestration

  The *when* of the EVE Industry platform. A thin Dagster project that decides
  which partitions are materialised and records that they were. It is one of six
  independent repositories; the platform-level rules live in `../CLAUDE.md`,
  this repo's in `CLAUDE.md`.

  ## The boundary everything else is subordinate to

  **Thin orchestration.** An asset invokes the `corpus` binary and records the
  run. No compute, no run-state, no data validation, and no parquet ever opened
  in this process — no pandas, no pyarrow. If a shim grows past a trivial
  dispatch, the logic belongs in a Rust subcommand in `eve-industry-corpus`, not
  in a longer asset.

  Three more follow from it:

  - **Storage boundary.** Corpus owns the contract — the
    `parquet + _INDEX.json + _DONE` shape, the `year=/month=/day=` layout,
    sha256, schema. This repo owns *placement*: it selects roots through flags
    and `CORPUS_*` env and triggers contract-aware operations. It never
    constructs a path layout and never moves contract bytes from Python.
  - **Config is the source of truth.** Partition start dates come from the
    corpus dataset YAML through `defs/config.py`, never from a literal. Silver
    and Gold have distinct starts.
  - **Status is keyed on the run-state**, the SQLite `partitions` table read
    through `corpus state query`, never on globbing the NAS tree. Globbing is
    slow and racy; the run-state is neither.

  ## State of the repository

  Twenty-odd asset modules under `src/eve_industry_orchestration/defs/`, one per
  dataset family, all reaching corpus through `corpus_resource`. The newest is
  `lp-store-offers-live`, the fifth member of the live current-overwrite
  family (`market-orders-live`, `market-prices-live`,
  `industry-cost-indices-live`, `public-contracts-live`): each is one
  non-partitioned Gold asset shelling `corpus live build` on a default-stopped
  fixed-cadence schedule. That family has no
  Silver tier, no partition matrix and no history, so `defs/config.py` resolves
  nothing for it and it is the standing exception to "sensor over cron" — there
  is no per-date availability to diff. The three EVE Ref members join the
  `everef_download` politeness pool; the two ESI ones share no endpoint with the
  Silver transfers and join no pool at all.

  `lp-store-offers-live` is where the family's mould bends, on measured grounds
  rather than inherited ones. One build fans out over all 283 NPC corporations
  and writes **two** Gold trees — `lp-store-offers` and `lp-store-offer-items` —
  before either is committed, so it is one asset and not one per tree: a second
  asset would repeat the 284-request fan-out and could leave one tree fresh
  against a stale other. Its status object is consequently the only
  multi-partition one here, a row count per derivative under `partitions` with
  no top-level `rows`, recorded as `rows.<derivative>`. Its cadence is daily,
  `30 11 * * *`, because every store's response expired at the same 11:05 UTC
  instant when measured — the caches roll together once a day, and an hourly
  poll would repeat the fan-out against a payload that only moves on
  deployments. The history half of public contracts is
  wired beside it as a day-partitioned Silver asset with an availability sensor
  of its own, and — since corpus landed its `gold:` block — four day-partitioned
  Gold assets, one per derivative, each with a readiness sensor of its own. All
  four fold a single day of Silver and hold no state across days, so their
  reach-back is zero and the Silver start stays the coverage floor the dataset
  YAML declares rather than a Gold `served_start` minus a window. `mer-killdump`
  is now the only dataset declaring no `gold:` block at all, which is what keeps
  `_resolve_silver`'s Gold-less branch reachable.

  Before it, the three sovereignty datasets landed complete through Gold: their
  Silver assets, all five Gold derivatives and a readiness sensor each, with
  nothing in the family materialised yet. The family also
  carries the assembled panel, which reads only Gold and no Silver at all —
  it declares its three same-day sibling trees, the trailing flip-window tree
  and the SDE snapshot as dependencies, so corpus ADR-0066's build order is a
  graph edge rather than schedule ordering. Availability is
  driven by `market_history_availability_sensor` rather than a fixed cron: EVE
  Ref publishes one file per calendar day with a variable intraday lag, so a
  daily cron would structurally miss yesterday.

  The first downstream consumer has landed: `defs/serving.py` and
  `defs/serving_resource.py` shell the idempotent `eve-serving load` CLI over
  SSH, four non-partitioned load assets hung off their source Gold availability
  with `deps=`, with `serving_load_sde` upstream of the three market loads
  because an SDE rebuild truncates `market.*`. Documented in
  `docs/serving-seam.md`. It is on an hourly schedule rather than a per-target
  sensor, because the loads are latest-only and the loader's `parquet_sha256`
  idempotency makes an unchanged hour a no-op.

  The SDE sensors key readiness on corpus run-state rather than on what has
  already been registered: `sde_build_discovery_sensor` re-proposes a build
  whose Silver never committed, and `sde_gold_sensor` additionally requests any
  changelog partition whose predecessor changed underneath it. That made
  `sde-changelog` Gold rebuildable in place, which is the first record under
  `docs/adr/` (ADR-0001).

  A materialisation now records what corpus measured, not what the asset was
  asked for: every partitioned asset merges the run-state `rows`,
  `retention_class` and `parquet_sha256` for the partition it just wrote over
  its identifying fields, read through `corpus state query`. Run-state keys are
  scheme-prefixed (`date=`, `build=`, `month=`, `latest`) and built by named
  helpers, never handed the bare Dagster key. The read is advisory — a missing
  row or a failed query warns and yields nothing rather than failing a run
  corpus passed. The tiers and trees corpus registers no single row for (Bronze,
  the live snapshots, MER's multi-year history Gold, SDE's per-entity snapshot
  Gold) record their identifying fields as before, each with the reason in place
  and a test pinning it.

  A Silver asset branches on the absence statuses `corpus ingest` can return for
  its own dataset, and on no others. A day the upstream never published is
  permanent and left Missing; a day still being published is retryable and left
  Missing to be re-proposed on the next tick — falling through to `verify` on
  either turns a successful ingest into a red run once per tick. Which of the two
  a dataset can produce is corpus's fetch layer to decide, not this repo's, and
  it varies: only `structures` and `public-contracts` declare the
  `member_suffix` that opens the publication-frontier verdict, and only
  `killmails` reaches it through the daily-tar year index. The other Silver
  assets carry no such branch and say in their docstring why it would be
  unreachable rather than protective, the argument `market_history.py` has made
  for its own missing `skipped` branch since it landed.

  ## Concurrency, which is where this repo is easiest to get wrong

  Two layers in `deploy/dagster.yaml`: a global `max_concurrent_runs` I/O cap —
  the single-HDD NAS spindle is the real limiter and every run taps it — and
  per-class limits as concurrency **pools** keyed on the assets' `pool=`, not run
  tags. A pool gates every launch path — sensor, UI backfill, manual — where a
  sensor-set run tag gates only the sensor.

  Membership of a memory-bearing pool is by **measured peak RSS**, not by whether
  a build is windowed: a narrow build put in one only starves the big backfills
  of scarce slots. Measure with `/usr/bin/time -v` before adding a build, and put
  the number in the change. Every memory-bearing pool counts against one box
  budget, because the pools do not know about each other and their peaks add.

  **The arithmetic itself lives in `deploy/dagster.yaml` and nowhere else** —
  which pools exist, their limits, each holder's peak, the worst case against the
  box, and where the box is provisioned. A change that restates any of those
  numbers in prose is adding the copy that drifts;
  `tests/test_concurrency_pools.py` pins the set of declared pools so a new one
  cannot arrive unaccounted.

  ## Stack

  Python 3.10-3.14, `src/` layout, uv (never pip), Dagster pinned exactly
  (`dagster==1.13.10`), PyYAML, ruff, pytest.

  **No type checker, deliberately.** The sister repositories (`serving`,
  `predict`, `calc`) run pyright and should; this one does not, because almost
  everything here is Dagster surface and pyright fights it. Calling a
  `@dg.sensor`-decorated object — which is how every sensor test in
  `tests/` drives one — types as a five-way union, so each assertion needs an
  `isinstance` narrowing that buys no safety. The gate is `ruff check`,
  `ruff format --check` and `pytest`. Do not add pyright back, and do not treat
  its absence as an oversight.

  `uv run pytest` exercises the Silver path against a fake `corpus` binary in
  `tests/fake_corpus.py` that mimics the contract and the `missing-partitions`
  and `state query` JSON. Point `CORPUS_BINARY_PATH` at it and `CORPUS_SINK_PATH`
  at a throwaway directory: no Rust build, no compute repo and no NAS needed.

  **Consult the `dagster-expert` skill before touching any Dagster definition.**
  It is the upstream-maintained skill and tracks the installed version; a
  definition written from memory is written against a different one. Do not
  hand-edit it — refresh it from upstream.

  ## Decisions

  The decisions live in the Decisions section of `ROADMAP.md`, in
  `docs/serving-seam.md`, and — since ADR-0001 — under `docs/adr/`, which a
  decision that outgrows a roadmap paragraph joins. ADRs here are not
  append-only — a superseded record is rewritten or deleted.

  ## How a change is worked

  One roadmap row is one OpenSpec change, one worktree under `.worktrees/`, one
  merge into `develop`. A question that cannot be settled inside the change goes
  to `docs/questions/` as a dated file, not to the terminal.

rules:
  proposal:
    - State which roadmap.yaml row this change implements, by id.
    - Fit one screen. Why is the row's goal by reference; What Changes are
      bullets; there is no design.md - the ADR is the design where there is
      one, and the proposal names it.
    - Say what the asset shells out to and what it records. If the proposal puts
      compute, parsing or validation in Python, stop - that belongs in
      eve-industry-corpus.
    - If an asset joins the heavy pool, give the measured peak RSS that earns it.
  tasks:
    - Every task is verifiable by a command or by reading one named file.
    - A task that adds or changes a Dagster definition says that it consults the
      dagster-expert skill first.

operations:
  apply:
    guidance:
      - Verify with `uv run ruff check .`, `uv run ruff format --check .` and
        `uv run pytest -q` against the fake corpus binary. Report only what
        failed.
      - Tick tasks in tasks.md as they finish; that is the progress signal.
      - A bundle that touches an asset, a sensor, a schedule or a resource
        method materialises one partition or previews one sensor tick in a
        scratch Dagster instance against the real corpus binary before review
        - DAGSTER_HOME and CORPUS_SINK_PATH under
        C:\tmp\orchestration-scratch\<id>, Y:\ read and never written - and
        the run's evidence goes to the reviewer.
  archive:
    guidance:
      - If the change settled a question in docs/questions/, resolve that file -
        into an ADR if the answer is a decision, deleted if it was not.
      - Set the roadmap.yaml row's `status` to `done` in the same commit, and
        mark the matching work item in ROADMAP.md.
