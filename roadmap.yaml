      release, as the live twin's row already notes.

      Found while reviewing, and NOT fixed here: nine sibling Silver assets —
      `system_jumps`, `system_kills`, `market_orders`, `industry_cost_indices`,
      `structures`, `killmails` and the three sovereignty datasets — branch only
      on `status: skipped` and not on `status: incomplete`. corpus maps a
      publication-frontier day to `incomplete` on exit 0 with no partition
      written, so the fall-through verify 404s and the run goes red once per
      sensor tick until upstream settles. This row's own asset branches on both;
      the siblings are a fix of their own.

  - id: silver-incomplete-status-family
    title: Branch every Silver asset on the status corpus can actually return
    goal: >
      A Silver asset that does not branch on an absence status corpus can emit
      falls through to `corpus verify`, which fails on the partition the ingest
      deliberately did not write — turning a successful ingest into a red run,
      once per availability tick, because the sensors rotate their `run_key`.
      `public_contracts_silver` had just been given both branches; nine siblings
      carried only `skipped`. Establish per dataset whether `incomplete` is
      reachable, add the branch only where it is, and where it is not, record why
      in the module — a branch added where corpus cannot emit the status is dead
      code, the argument `market_history.py` already makes for its own missing
      `skipped` branch.
    areas: [orchestration]
    priority: 2
    status: done
    notes: >
      Landed 2026-09-02. Two of the nine, not nine: `structures` (declares
      `member_suffix: .v2.json.bz2`, so a listed folder with no member of that
      suffix reaches `DeclaredSuffixVerdict::PublicationFrontier`, corpus
      ADR-0064) and `killmails` (`daily-tar-of-json`, whose 404 resolves through
      the year index to `IndexVerdict::NotYetPublished`, ADR-0028's 2026-09-01
      extension). The other seven got one docstring sentence each and no branch.

      The reachability argument is closed on three legs, all read in corpus
      source rather than assumed: `member_suffix` appears in exactly three
      dataset YAMLs (`structures`, `public-contracts`, `public-contracts-live`);
      the `hourly-folder-tar` config variant hardcodes `member_suffix: None`
      (`crates/corpus-everef/src/source.rs:79-86`), so those six have no field to
      declare one even in principle; and `daily_completeness` returns `Some` only
      for `daily-file`, so ADR-0041's stability and floor gates — the third
      producer of `SkippedIncomplete` — are dead for all nine.

      The `incomplete` branch cannot be shown against the real binary: it needs an
      upstream day genuinely mid-publication, which is not reproducible on demand.
      So each changed asset was run twice — an ordinary partition against the real
      binary (structures 2026-08-29, 2 485 rows; killmails 2026-08-25, 243 020
      rows) to prove the daily path still works, and the branch itself against the
      fake binary with `FAKE_INCOMPLETE_DATES`. A row touching an absence branch
      should expect the same shape.

  - id: public-contracts-gold-wiring
    title: Teach config.py the four public-contracts Gold shapes and wire them
    goal: >
      Corpus merged `public-contracts-gold` on 2026-09-02, adding a `gold:` block
      to `public-contracts.yaml` with four derivatives — shapes `contract-facts`,
      `contract-item-facts`, `contract-item-prices` and `courier-rates`.
      `config.py`'s `_lookback_for_shape` knows none of them, so loading the code
      location against the real datasets dir raises `PartitionConfigError` at
      import and nothing loads at all. Teach it the four shapes and their
      reach-back, wire the four Gold assets, and refresh
      `tests/fixtures/datasets/public-contracts.yaml`, which still carries no
      `gold:` block and is why the suite stayed green through the breakage.
    areas: [orchestration]
    depends_on: [corpus:public-contracts-gold]
    priority: 1
    status: done
    notes: >
      Found 2026-09-02 by two builders of `silver-incomplete-status-family`
      independently, both of whom worked around it with a scratch copy of the
      datasets dir to run at all. Priority 1 because it is not a gap but a break:
      the code location does not load.

      `public-contracts-silver-wiring` added `resolve_silver_start`'s Gold-less
      branch for this dataset. That branch is not wrong and other datasets may yet
      need it, but public-contracts no longer takes it — with a `gold:` block the
      Silver start resolves through the derivatives again, which is where the
      unknown shapes bite. Do not delete the branch on the strength of this row;
      check whether any dataset still has no `gold:` block first.

      The fixture lagging reality is the second half of the lesson: a dataset
      fixture that never gains the block the real YAML gained cannot catch this
      class of break.

      Landed 2026-09-02. `mer-killdump` is now the only dataset declaring no
      `gold:` block, so `_resolve_silver`'s Gold-less branch was kept. All four
      shapes share one zero-reach-back arm: each folds a single day of Silver and
      holds no cross-day state, so the Silver start stays the coverage floor and
      Silver and Gold share 2021-06-17.

      The guard against the next such break is a test that LOADS THE DEFS FOLDER
      in a subprocess against the sibling datasets dir, skipped when absent — not
      "resolve every YAML", which is permanently red because twelve datasets
      declare shapes `_lookback_for_shape` has never known and resolve elsewhere,
      and not "import definitions.py", which proves nothing because `@definitions`
      is lazy. Whether the fixture SET should be generated from the sibling
      checkout rather than hand-maintained is still open and still worth a row.

      Real run: Silver 2021-06-17 gave 14 616 340 rows / 118.2 MiB in 35.4 s, and
      `contract-facts` folded that to 3 758 Gold rows in 5 s — the fold is three
      orders of magnitude narrower than its input, so a memory-bearing pool is
      unlikely to be owed, but no `/usr/bin/time -v` peak was taken and none of
      the four joined a pool. The other three derivatives have never been built.

      The local `corpus` binary had to be rebuilt (`cargo build --release`) before
      the run: the installed one predated the corpus row and rejected the four
      shapes at YAML parse. Its `--version` still prints a stale build-script
      stamp, so trust the mtime, not the string. The LXC needs the same release
      before it can materialise these.

  - id: lp-store-offers-live
    title: Wire the lp-store-offers-live dataset into Dagster
    goal: >
      One non-partitioned asset shelling `corpus live build --dataset
      lp-store-offers-live`, on a daily schedule. One binary call fetches the 284
      ESI responses once and overwrites two Gold `current/` trees —
      `lp-store-offers` (31 847 rows) and `lp-store-offer-items` (35 066) — so
      two assets would mean two processes re-fetching the same payload. Modelled
      on `market_prices_live.py` and `tests/test_market_prices_live.py`; it
      should read as the near-copy it is.
    areas: [orchestration]
    depends_on: [corpus:lp-store-offers-live]
    priority: 3
    status: done
    notes: >
      Landed 2026-09-02, the day corpus shipped the dataset (ADR-0070). The goal
      above is corrected in the same commit: it said **three** Gold trees, with
      `lp-npc-corps` among them, because it was written against the probe in
      `corpus/tmp/lp/`. What shipped is **two** — the 283 NPC corporations are
      the fan-out root the binary derives, not a derivative anything consumes.
      Trust the corpus dataset YAML over a pre-landing sketch.

      The other correction the same sketch owed: the status object is
      **multi-partition**, the only one in this repository that is. Row counts
      arrive per derivative under `partitions`, and there is no top-level `rows`
      — an asset copying the `market-prices-live` shape would have recorded
      nothing and said so nowhere. The metadata records them as
      `rows.<derivative>`, alongside `corporations` and `empty_stores`, which are
      the numbers that say whether a thin result is real (102 of 283 stores are
      legitimately empty).

      What held: a schedule and not a sensor; daily at `30 11 * * *` and not
      hourly; no pool and nothing in `deploy/dagster.yaml`; no
      `partition_metadata` enrichment and no `corpus verify`. The cadence's
      reasoning firmed up on measurement — every store returns `Expires:
      11:05:00 UTC` the following day, so the caches roll together once a day and
      11:30 is comfortably past the roll, which is a stronger argument than the
      shared `Last-Modified` the probe reasoned from.

      Real run: RUN_SUCCESS in 3.36 s against the real binary — 283 corporations
      at four in flight, 102 empty stores, 31 847 + 35 066 rows. Both
      `_INDEX.json` carried the same `run_id`, `live-esi-20260902T110652Z`, which
      is the check that the two trees came from one fetch; a kill between the two
      commits is what would break it. The 284-request fan-out needed nothing in
      Python: the retries, the four-in-flight bound and the rule that an
      exhausted GET fails the whole run all held in the Rust fetch arm.

      Left on the table, and no work now: the status object carries a
      `parquet_sha256` per partition that the materialisation does not record.
      It would be the cheapest per-tree signal a reader has, but no spec asks for
      it and no consumer has yet.

      The local `corpus` binary had to be built before the run — none existed at
      `target/release/` — and `cargo build --release` failed twice on MSVC
      `C1056` (`cannot update the time date stamp field`) in `ring` and
      `onig_sys` before succeeding on a third attempt. Cargo keeps what compiled,
      so retrying is the fix. The LXC needs a corpus release containing this
      dataset before it can materialise the asset.
