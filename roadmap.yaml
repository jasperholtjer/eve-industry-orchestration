  - id: public-contracts-live-wiring
    title: Wire public-contracts-live into the code location
    goal: >
      `public-contracts-live` (corpus ADR-0068) is built and has no Dagster
      asset. It is the current-overwrite lifecycle of ADR-0039/0040: `corpus
      live build` lists the newest per-date folder, fetches one
      `.v2.tar.bz2`, and collapses it to one row per open contract in
      `gold/public-contracts-live/current/`. No Silver tier, no day-partition
      matrix, no history, so `config.py` resolves nothing here. Land the shim
      on the `market_orders_live` mould: one non-partitioned Gold asset in
      `everef_download`, a fixed-cadence schedule on the upstream ~30-minute
      rhythm (~47 snapshots a day), and the fake-binary test. The live status
      object carries `snapshot_at` — the payload's own `scrape_start`, which
      the filename's drifting seconds field does not give — so the freshness
      the asset records comes from there.
    areas: [orchestration]
    depends_on: [corpus:public-contracts-live]
    priority: 3
    status: done
    notes: >
      Landed 2026-09-01. One non-partitioned asset, one schedule, five tests;
      `config.py`, `deploy/dagster.yaml` and the pool set are untouched, as a
      live dataset owes them nothing.

      The two history rows are not this row and were not anticipated here.
      Corpus `public-contracts-silver` has since landed — ADR-0068 decision 5
      settled the four-tables question as one table with the fold moved to
      Gold — and is wired by `public-contracts-silver-wiring` below. Corpus
      `public-contracts-gold` is still `todo`, so a Gold asset would still be
      dead code.

      No pool is added and none is owed a measured peak: the live build holds
      one 4.3-6.2 MiB archive, and `everef_download` is politeness rather than
      memory. The Silver backfill later needs the daily schedules paused or a
      pool of its own (corpus `tmp/contracts/measurements-2026-09-01.md`
      section 7.5); that arrives with its own row.

      The schedule is `15,45 * * * *`, not `*/30`: with all four live schedules
      enabled the minute-:00 tick would launch three EVE Ref fetches against an
      `everef_download` limit of 2 and four runs against `max_concurrent_runs:
      4`, so the live family could hold the whole global cap on every hour
      boundary. The cadence is what the row needs and the offset is free on a
      last-write-wins tree.

      Materialising this on the LXC waits on a corpus release: the deploy
      installs the binary from a GitHub Release and the latest tag predates
      both this dataset and the sovereignty family. The row is testable now
      against `tests/fake_corpus.py` regardless, as the sovereignty rows were.
      The schedule ships default-stopped, so nothing queues doomed runs in the
      meantime.

  - id: public-contracts-silver-wiring
    title: Wire the public-contracts history Silver into the code location
    goal: >
      `public-contracts` — the history tier over EVE Ref's public-contract
      snapshots, corpus ADR-0067/0068 — is built and has no asset. Land the
      Silver half on the `system_jumps` mould: one day-partitioned
      `public_contracts_silver` asset over `corpus ingest` then `corpus verify
      --tier silver`, the availability sensor off `corpus everef
      missing-partitions` keyed on run-state, the fake-binary tests, and the
      backfill's run-planning in `deploy/dagster.yaml`. The dataset declares no
      `gold:` block — the derivatives are corpus's `public-contracts-gold`, still
      open — so `config.py` cannot resolve it at all: every partition start here
      is derived from a dataset's Gold derivatives. It gains a Silver-only path
      that resolves from the `silver.served_start` coverage floor instead. The
      already-wired live twin is a separate dataset and is not touched.
    areas: [orchestration]
    depends_on: [corpus:public-contracts-silver]
    priority: 3
    status: done
    notes: >
      Landed 2026-09-02. `resolve_silver_start` in `config.py` is one code path
      with `resolve_partition_starts`, so a Gold-bearing dataset resolves exactly
      as before; the Silver start is 2021-06-17, the coverage floor. No ADR: a
      resolution path under ADR-0027 is not a new decision.

      The real run materialised 2021-06-17 against the corpus binary and wrote
      14 616 340 rows — exactly the figure corpus measured independently for that
      day — 28/28 archives, 118.2 MiB of Silver in 21.9 s. Peak working set ~374
      MiB across three agreeing measurements. That number is indicative only: it
      is a Windows workstation peak, not the `/usr/bin/time -v` maximum RSS on the
      LXC that pool membership requires, and `deploy/dagster.yaml` labels it as
      such. It is enough to say the build is sub-GiB rather than multi-GiB, which
      is why it joins `everef_download` and no memory-bearing pool — and the
      ingestor's own source says the same, streaming one archive at a time so a
      day's ~47 snapshots never coexist.

      The budget line moved: `everef_download` is no longer "negligible", because
      public-contracts is its heaviest holder at ~0.37 GiB per slot, and the paper
      worst case is now ~17.15 GiB on a 12 GiB box rather than ~16.4. Nothing
      about that is new risk — it was always there, uncounted.

      The 1 892-partition backfill is an operator action, not this row and not the
      sensor's: `everef missing-partitions` defaults to a 30-day window, so the
      sensor is structurally trailing-edge. Launching the backfill pauses the
      daily schedules for its ~8.2 h, and it is gated on someone taking the LXC
