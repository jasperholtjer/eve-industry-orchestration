# Dagster instance config. Copy to $DAGSTER_HOME/dagster.yaml on the LXC.
# Storage defaults to SQLite under DAGSTER_HOME (NVMe) — no DB-VM dependency.

# Bounded concurrency, two independent layers.
#
# 1. Global cap (`max_concurrent_runs`) — the universal default for EVERY run,
#    pooled or not. The single-HDD UNAS over NFS is the real limiter: every run
#    (Silver write + verify-read, Gold read + write) taps the same spindle, so the
#    global cap stays modest to avoid seek-thrashing. Raise toward 6 only if the
#    NAS holds. A run with no pool is bounded by this alone.
#
# 2. Per-class exceptions via concurrency POOLS (`concurrency.pools`) — an asset
#    opts in with `pool=` (see market_history.py) and is then bounded by
#    min(global cap, pool limit). Pools gate at the asset/step, so they throttle
#    EVERY launch path — sensor, UI backfill, manual — unlike a sensor-set run tag.
#    `run` granularity queues at the run level (no idle run workers). Three pools:
#      - `heavy` (limit 2 via `default_limit`): MEMORY. The shared budget for every
#        heavy `corpus` Gold build (a 365-day rolling window peaks ~3-4 GB).
#        Sharing ONE budget across all Gold work caps Gold memory at ~2 x ~4 GB
#        ≈ 8 GB however the coordinator mixes builds.
#      - `market_orders` (limit 1, set via CLI in redeploy.sh — see below): CPU.
#        market-orders Silver is the ONLY ingestor that parses with rayon, so a
#        single run saturates every core on the box; a second concurrent run only
#        oversubscribes the cores with no throughput gain. limit 1 keeps exactly
#        one CPU-saturating Silver run in flight while single-threaded datasets
#        fill the remaining cores via their own pools. A market-orders Silver day
#        is ~75M rows of full k-space orderbook, but the binary streams it one
#        row-group per snapshot, so its peak (~3-4 GB) is a Gold-equivalent — the
#        limit-1 pool bounds that memory too. See defs/market_orders.py.
#      - `everef_download` (limit 2 via `default_limit`): POLITENESS to
#        data.everef.net. The light Silver fetches (market-history, system-jumps,
#        system-kills, sde). EVE Ref endorses a small fan-out (its rclone example
#        uses `--transfers 2`), so 2 concurrent.
#    `heavy` and `everef_download` want 2, so `default_limit: 2` covers them with
#    no per-pool override. `market_orders` needs limit 1, which the yaml cannot
#    express (only `default_limit` lives here) — redeploy.sh sets it via
#    `dagster instance concurrency set market_orders 1` after publishing this
#    config, so the override is reproducible at deploy time. Worst-case heavy
#    memory is 2 Gold + 1 market-orders Silver ≈ 3 x ~4 GB ≈ 12 GB (unchanged by
#    the split — same heavy-slot count); size the LXC >= 12 GiB. Tune the global
#    default with
#    `/usr/bin/time -v`. Lightweight datasets omit `pool=` entirely and stay
#    bounded only by the global cap of 4.
#
# The `sde` dataset (build-versioned, ADR-0031) puts `sde_silver` in
# `everef_download` (it fetches one ~94 MB archive per build) but keeps both Gold
# derivatives OUT of `heavy`: `sde_changelog_gold` / `sde_snapshot_gold` are
# row diffs / blob passthroughs over a single build's Silver, not a windowed scan,
# so they are light. SDE builds are rare (game patches), so neither pool is under
# pressure from it.
#
# The hourly `system_jumps_recent_schedule` is deliberately NOT in the
# `heavy` pool: the EWMA "recent" build spans only the short warmup, so it is
# lightweight and bounded by the global cap alone. At most one such run is in
# flight per hour, so it cannot starve the windowed `system_jumps_history_gold`
# backfills that do hold `heavy`.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

# `max_concurrent_runs` lives under `concurrency.runs`, not `run_coordinator`:
# Dagster rejects the legacy `run_coordinator.config.max_concurrent_runs` once a
# `concurrency:` block is present (they are the same setting in two locations).
concurrency:
  runs:
    max_concurrent_runs: 4
  pools:
    default_limit: 2
    granularity: "run"

# Headless homelab box, no usage stats. Disabled to keep the daemon/webserver
# logs free of the telemetry notice on every start.
telemetry:
  enabled: false
