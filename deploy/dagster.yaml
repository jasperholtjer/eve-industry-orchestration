# Dagster instance config. Copy to $DAGSTER_HOME/dagster.yaml on the LXC.
# Storage defaults to SQLite under DAGSTER_HOME (NVMe) — no DB-VM dependency.

# Bounded concurrency, two independent layers. THIS FILE OWNS THE MEMORY
# ARITHMETIC: AGENTS.md and ROADMAP.md carry only the invariant and point here,
# so the budget below is the one copy that is maintained. A new pool means an
# edit here, and tests/test_concurrency_pools.py fails until it lands.
#
# 1. Global cap (`max_concurrent_runs`) — the universal default for EVERY run,
#    pooled or not. It is the NAS SPINDLE'S I/O CAP and nothing else: the
#    single-HDD UNAS over NFS is the real limiter, since every run (Silver write +
#    verify-read, Gold read + write) taps the same spindle, so the cap exists to
#    avoid seek-thrashing. It is NOT a memory backstop — the memory ceiling is the
#    pool limits below, and the two must not be conflated again: this cap was 4
#    only because the memory-bearing slots also summed to 4, which made it look
#    load-bearing for RAM when it never was. A run with no pool is bounded by this
#    alone, and by nothing else.
#
# 2. Per-class exceptions via concurrency POOLS (`concurrency.pools`) — an asset
#    opts in with `pool=` (see market_history.py) and is then bounded by
#    min(global cap, pool limit). Pools gate at the asset/step, so they throttle
#    EVERY launch path — sensor, UI backfill, manual — unlike a sensor-set run tag.
#    `run` granularity queues at the run level (no idle run workers). Exactly THREE
#    pools are declared, two of which carry memory:
#      - `heavy` (limit 1 via `default_limit`): MEMORY, 4.4 GiB per holder. The
#        shared budget for the wide-window `corpus` Gold builds that actually peak
#        there — market-history Gold and market-orders Gold (a 365-day window over
#        wide daily files) — AND for the two `corpus enrich embed` steps
#        (news-embeddings, transcripts-embeddings; corpus ADR-0053), which run the
#        pinned local ONNX model in-process at 4.4 GiB RSS (measured) and are now
#        the pool's heaviest possible holder. limit 1 is what makes that
#        membership worth anything: an embed and a windowed Gold build can never
#        be in flight together, which no separate pool can express, because a pool
#        bounds a class only against ITSELF. See docs/adr/0002-*.md for why
#        membership was bought for exclusion rather than for a measured peak, and
#        what it costs (the windowed Gold backfills now serialise).
#        system-jumps/system-kills/cost-indices Gold use the same 365d window but
#        over ~5k-row/day narrow snapshots (measured peak ~90-97 MiB), so they omit
#        `pool=` and stay on the global cap alone.
#        killmails Gold (corpus ADR-0061) joins `heavy` PROVISIONALLY — the one
#        member admitted on expectation rather than measurement, because it is the
#        only 365-day window over the corpus's largest Silver (1-3M item-rows/day)
#        and an unbounded 3-4 GiB build would OOM the LXC mid-backfill. MEASURE IT
#        with `/usr/bin/time -v` on a real day and drop `pool=` in defs/killmails.py
#        if the peak lands with the narrow builds. killmails SILVER stays out: the
#        day tar is a few MiB and the parse holds narrow rows, so it takes only
#        `everef_download`.
#      - `market_orders` (limit 1 via `default_limit`): CPU
#        *and* MEMORY, ~3-4 GiB per holder (UNMEASURED — no `/usr/bin/time -v`
#        result exists for it). market-orders Silver is the ONLY ingestor that
#        parses with rayon, so a single run saturates every core on the box; a
#        second concurrent run only oversubscribes the cores with no throughput
#        gain (`fc594e2` split it out of `heavy` on that observation). limit 1
#        keeps exactly one CPU-saturating Silver run in flight while
#        single-threaded datasets fill the remaining cores via their own pools.
#        A day is ~75M rows of full k-space orderbook, streamed one row-group per
#        snapshot over a bounded resident window (corpus >= v0.9.0), so its peak is
#        Gold-equivalent. limit 1 bounds this dataset only AGAINST ITSELF; it says
#        nothing about overlap with `heavy` — that is what the budget below is
#        for. It stays its own pool rather than joining `heavy`: it is bounded for
#        CPU saturation, and folding it in would park every windowed Gold build
#        behind a multi-hour Silver run. The resident window is pinned by
#        CORPUS_PARSE_CONCURRENCY in both systemd units, not by the core count.
#        See defs/market_orders.py.
#      - `everef_download` (limit 2, set via CLI in redeploy.sh — see below):
#        POLITENESS to
#        data.everef.net, NOT memory. The light Silver fetches (market-history,
#        system-jumps, system-kills, killmails, sde, industry-cost-indices, mer,
#        mer-killdump, structures, sovereignty-map, sovereignty-structures,
#        sovereignty-campaigns, public-contracts, and the `_LIVE_POOL` assets,
#        which alias this same name). EVE Ref endorses a small fan-out (its
#        rclone example uses `--transfers 2`), so 2 concurrent.
#    `default_limit` is 1, which covers `heavy` and `market_orders` with no
#    per-pool override; `everef_download` is the only pool above it. The yaml
#    cannot express a per-pool limit at all (only `default_limit` lives here) —
#    redeploy.sh sets the one override via `dagster instance concurrency set
#    everef_download 2` after publishing this config, so it is reproducible at
#    deploy time. THE DEFAULT IS THE SAFE ONE ON PURPOSE: an instance-DB override
#    lives outside version control, so if it is ever lost the box falls back to 1
#    everywhere. That costs EVE Ref download speed — never a second concurrent
#    embed on a 12 GiB box. The memory ceiling must be what survives; the speed is
#    what may go missing.
#
# THE MEMORY BUDGET. One box, one budget: the pools do not know about each other,
# so their peaks add. Against the 12 GiB LXC:
#
#      pool             slots  peak/holder  total
#      heavy              1      4.4 GiB    ~4.4 GiB  (the embed steps' measured
#                                                      peak, which now dominates
#                                                      the pool's ~3-4 GiB Gold
#                                                      builds — see below)
#      market_orders      1     ~4 GiB      ~4 GiB    (UNMEASURED)
#      everef_download    2     ~0.37 GiB   ~0.75 GiB (indicative, not measured;
#                                                      public-contracts Silver is
#                                                      the heaviest holder, all
#                                                      other holders negligible)
#                                           --------
#      pooled worst case  4     4.4 + 4 + 2 x 0.37   = ~9.15 GiB
#
# `heavy`'s per-holder figure is 4.4 GiB and not ~3-4 GiB because the embed steps
# joined it: an embed is the heaviest thing that can hold the pool, and a pool's
# budgeted peak is its heaviest possible holder, not its typical one. That 4.4 GiB
# is a WINDOWS-WORKSTATION measurement (4.4 GiB RSS at 3.76 chunks/s, so a full
# 11 320-chunk generation is ~50 min) and has NEVER been run on the LXC. What
# corrects it is `/usr/bin/time -v` on the first real embed there (needs
# CORPUS_DATASETS_DIR); until that number exists, 4.4 GiB is the working figure
# and the pool is sized on it.
#
# ~9.15 GiB IS NOT THE CEILING — IT IS ONLY THE POOLED TERM. The pooled worst case
# fills 4 of the 6 run slots, so two UNPOOLED runs can sit on top of it. The
# candidates are `public_contracts` Gold and the three `sovereignty_*` Gold
# builds, none of which has a measured peak (their own module comments say so).
# The honest statement of the worst case is therefore:
#
#      ~9.15 GiB + 2 x unmeasured, on a 12 GiB box
#
# and not a closed number. Before the pools carried exactly `max_concurrent_runs`
# slots the arithmetic closed itself by accident; it no longer does, and pretending
# otherwise would re-hide the same gap the row that raised the cap set out to
# expose. Measuring those two unpooled builds is what closes it — either into a
# term with a figure, or into `heavy` membership.
#
# The worst case is stated rather than solved, deliberately. All six OOM kills the
# box has ever recorded predate corpus v0.7.0/v0.9.0 (streaming ingest, bounded
# parse window) and the `market_orders` pool split, and 68 days have run clean
# since; `memory.peak` counts since boot, so the 11.9 GiB high-water mark on the
# box belongs to that same superseded configuration. There is no measurement of
# what runs today, and buying RAM for a paper number is the wrong order.
#
# PUBLIC-CONTRACTS SILVER IS `everef_download`'S HEAVIEST HOLDER, per the table
# above — not zero, as the pool's "politeness, not memory" framing might
# suggest for every other holder. The ingestor streams one archive at a time
# in ascending `snapshot_at` and emits each (snapshot, member) pair as its own
# batch, so a day's ~47 snapshots never coexist; one snapshot is held several
# times over while its seven members are widened, so peak is a small multiple
# of one decompressed archive — ~63 MB for a recent day (corpus
# `crates/ingestor-public-contracts/src/silver.rs:34-46`). No `/usr/bin/time
# -v` figure exists to confirm the multiple on the LXC: corpus
# `tmp/contracts/measurements-2026-09-01.md` §7.5 states the scheduling
# problem and gives no number. The 374.5 MiB in the table is this row's own
# indicative measurement — a Windows-workstation peak working set, NOT the
# `/usr/bin/time -v` maximum RSS pool membership requires, roughly 6x one
# archive — and that order of magnitude, not a budgeted per-holder figure, is
# what the next row measures from on the LXC. The full backfill is 1 892
# partitions, ~8.2 h at
# `everef_download`'s limit of 2, so it overlaps the daily schedules — and of
# the two handlings §7.5 offers, this deployment takes the first: the daily
# schedules are paused for the backfill's duration. It gets no bound of its own,
# because length is not memory and a pool bought with an unmeasured peak is the
# membership rule this file exists to hold.
#
# NEXT STEP, before any pool limit or box size moves: reset the high-water mark
# (`echo > /sys/fs/cgroup/memory.peak`, kernel >= 6.9), let the current
# configuration run, and read it back. Then size. The first lever is lowering
# CORPUS_PARSE_CONCURRENCY in the two systemd units, which is cheaper than RAM.
# Per-build peaks are measured with `/usr/bin/time -v` (needs CORPUS_DATASETS_DIR).
#
# The box size is an input to the arithmetic above, but it is NOT set here: RAM
# and cores live on the Proxmox host — `pct set 211 --cores 8 --memory 12288
# --swap 2048`. Authoritative host provisioning is in `homelab_docs`
# (`docs/howto/deploy-dagster-lxc.md`).
#
# The `sde` dataset (build-versioned, ADR-0031) puts `sde_silver` in
# `everef_download` (it fetches one ~94 MB archive per build) but keeps both Gold
# derivatives OUT of `heavy`: `sde_changelog_gold` / `sde_snapshot_gold` are
# row diffs / blob passthroughs over a single build's Silver, not a windowed scan,
# so they are light. SDE builds are rare (game patches), so neither pool is under
# pressure from it.
#
# The two killmails drift sensors (corpus ADR-0060) run DAILY, not hourly: drift
# is slow-moving and each hit costs a re-ingest of the heaviest Silver plus a
# `heavy` Gold rebuild. They share the same caps as every other launch path, and
# `MAX_PARTITIONS_PER_TICK` bounds a drift storm to 10 repairs per tick — so the
# repair loop can slow a backfill but never stampede it.
#
# The hourly `system_jumps_recent_schedule` is deliberately NOT in the
# `heavy` pool: the EWMA "recent" build spans only the short warmup, so it is
# lightweight and bounded by the global cap alone, same as
# `system_jumps_history_gold` — neither system-jumps build ever holds `heavy`.
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator

# `max_concurrent_runs` lives under `concurrency.runs`, not `run_coordinator`:
# Dagster rejects the legacy `run_coordinator.config.max_concurrent_runs` once a
# `concurrency:` block is present (they are the same setting in two locations).
concurrency:
  runs:
    max_concurrent_runs: 6
  pools:
    default_limit: 1
    granularity: "run"

# Headless homelab box, no usage stats. Disabled to keep the daemon/webserver
# logs free of the telemetry notice on every start.
telemetry:
  enabled: false
