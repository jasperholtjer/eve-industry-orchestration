[project]
name = "eve_industry_orchestration"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.10",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "eve_industry_orchestration"
registry_modules = [
    "eve_industry_orchestration.components.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the point; long shell-out arg lines mirror the CLI surface.
"tests/**" = ["S101", "E501"]


