name: public-contracts
schema_version: 1
source:
  kind: everef
  layout: hourly-folder
  base_url: https://data.everef.net/public-contracts/history
  member_suffix: .v2.tar.bz2
  ignorable_member_suffixes:
    - .json.gz
bronze:
  retention_days: 1
silver:
  parquet_codec: zstd
  parquet_codec_level: 3
  sort_keys: [snapshot_at, member]
  # Coverage floor (ADR-0027): the first day of the `.v2.tar.bz2` era. Mirrors
  # the corpus dataset config, which is the source this start is read from.
  served_start: 2021-06-17
# The four folds corpus declares (ADR-0068 decision 5), mirroring
# `../eve-industry-corpus/datasets/public-contracts.yaml`. Every builder holds
# no cross-day state, so each day's Gold is a function of that day's Silver
# alone and `served_start` is the Silver floor unchanged.
gold:
  - name: contract-facts
    shape: contract-facts
    sort_keys: [region_id, contract_id]
    served_start: 2021-06-17
  - name: contract-item-facts
    shape: contract-item-facts
    sort_keys: [contract_id, record_id]
    served_start: 2021-06-17
  - name: contract-item-prices
    shape: contract-item-prices
    sort_keys: [date, region_id, type_id]
    served_start: 2021-06-17
  - name: courier-rates
    shape: courier-rates
    sort_keys: [date, start_region_id, end_region_id]
    served_start: 2021-06-17
