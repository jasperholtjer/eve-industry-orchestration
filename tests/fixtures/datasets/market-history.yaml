name: market-history
schema_version: 1
source:
  kind: everef
  layout: daily-file
  base_url: https://data.everef.net/market-history
  filename_template: "{year}/market-history-{year}-{month:02d}-{day:02d}.csv.bz2"
silver:
  parquet_codec: zstd
  parquet_codec_level: 19
  sort_keys: [region_id, type_id]
# ADR-0025 — gold is a list of named, shaped derivatives. market-history
# publishes one rolling derivative; mirrors the real corpus config shape.
gold:
  - name: market-history
    shape: rolling
    sort_keys: [region_id, type_id, date]
    served_start: 2021-01-01
    rolling:
      horizons_basic: [1, 7, 30, 90, 365]
      horizons_vwap: [7, 30, 90, 365]
      horizon_52w: 365
      coverage_min_ratio: 1.0
