name: market-history
schema_version: 1
source:
  kind: everef
  base_url: https://data.everef.net/market-history
  filename_template: "{year}/market-history-{year}-{month:02d}-{day:02d}.csv.bz2"
gold:
  served_start: 2021-01-01
  sort_keys: [region_id, type_id, date]
  rolling:
    horizons_basic: [1, 7, 30, 90, 365]
    horizons_vwap: [7, 30, 90, 365]
    horizon_52w: 365
    coverage_min_ratio: 1.0
