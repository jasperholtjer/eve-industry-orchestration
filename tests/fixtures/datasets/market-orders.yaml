name: market-orders
schema_version: 1
source:
  kind: everef
  layout: hourly-folder
  base_url: https://data.everef.net/market-orders/history
bronze:
  retention_days: 14
silver:
  parquet_codec: zstd
  parquet_codec_level: 19
  sort_keys: [snapshot_at, order_id]
  # Coverage floor (ADR-0027 / ADR-0033): 2021-07-09 is the first full-cadence
  # day; the orchestrator clamps the Silver matrix to it.
  served_start: 2021-07-09
# ADR-0036 / ADR-0042 — three independent Gold derivatives split from the single
# ADR-0033 orderbook-sweep. One-snapshot look-back (one prior day) on all.
gold:
  - name: market-orders-snapshot
    shape: orderbook-aggregate
    sort_keys: [region_id, type_id, snapshot_at]
    served_start: 2021-07-09
    orderbook:
      percentile: 5
      delta: false
  - name: market-orders-changes
    shape: orderbook-delta
    sort_keys: [region_id, type_id, snapshot_at]
    served_start: 2021-07-09
    orderbook:
      percentile: 5
      delta: true
  - name: market-orders-events
    shape: orderbook-events
    sort_keys: [region_id, type_id, event_at, order_id]
    served_start: 2021-07-09
    orderbook:
      percentile: 5
      delta: true
